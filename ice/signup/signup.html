<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
            display: grid;
            align-items: center;
            justify-content: center;
        }
        #formContainer {
            background: rgb(255, 255, 255);
            border: 10px solid rgb(30, 1, 101);
            border-radius: 10px;
            width: 300px;
            position: relative;
            display: grid;
            
        }
        #images img{
            width: 50px;
            height: 70px;
            margin: 3px;
        }
        #hi {
            width: 100%;
            height: 200px;
            object-fit: cover;
            object-position: top;
            grid-row: 1/2;
            z-index: 0;
        }
        title {
            text-align: center;
            color: white;
            font-size: 1.5em;
            grid-row: 1/2;
            z-index: 1;
            text-shadow: 2px 2px 4px #000000;
        }
        h3 {
            display: grid;
            text-align: center;
        }
        #closeBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            border: none;
        }
        #myForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-gap: 10px;
            padding: 10px;
        }
        .l1 {
            display: grid;
            grid-column: 1/2;
        }
        .i1 {
            display: grid;
            grid-column: 2/3;
        }
        h3 {
            grid-column: 1/3;
        }
        .lower_form {
            grid-column: 1/3;
            text-align: center;
        }

    
    </style>




</head>

<body>
    <div id="formContainer">
        <title>Daily Feed Sign Up</title>
        <img id="hi" src="images/jesus_feeds_5000.jpeg" alt="Jesus Feeding the 5000">
        <form id="myForm">
            <h3>Sign Up for Daily Scripture Feed</h3>
            <button type="button" id="closeBtn">X</button>
            <label class="l1"for="username">User Name:</label>
            <input class="i1"type="text" id="username" name="username" required>

            <label class="l1" for="password">Password:</label>
            <input class="i1" type="password" id="password" name="password" required>

            <label class="l1" for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section class="lower_form">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section class="lower_form">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section class="lower_form">
                <button type="submit">Submit</button>
            </section>
        </form>
    <div id="images">
        <img src="images/book_of_mormon.webp" alt="Book of Mormon">
        <img src="images/doctrine_and_covenants.webp" alt="Doctrines and Covenants">
        <img src="images/new_testament.webp" alt="New Testament">
        <img src="images/old_testament.webp" alt="Old Testament">
        <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
    </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
